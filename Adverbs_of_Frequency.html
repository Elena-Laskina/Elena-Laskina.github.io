<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Often Do You...? 🌟</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff6b9d;
            --orange: #ffa751;
            --yellow: #ffd93d;
            --mint: #6bcf7f;
            --blue: #4d96ff;
            --purple: #9b59b6;
            --dark: #2d3436;
            --cream: #fff8e7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* Декоративные плавающие фигуры на фоне */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            opacity: 0.3;
            z-index: 0;
        }

        body::before {
            width: 200px;
            height: 200px;
            background: var(--yellow);
            top: -50px;
            left: -50px;
            animation: float 6s ease-in-out infinite;
        }

        body::after {
            width: 250px;
            height: 250px;
            background: var(--mint);
            bottom: -80px;
            right: -80px;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, 20px); }
        }

        .game-container {
            background: var(--cream);
            width: 100%;
            max-width: 750px;
            border-radius: 35px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 5px solid white;
        }

        .header {
            background: linear-gradient(135deg, var(--pink) 0%, var(--orange) 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '✨';
            position: absolute;
            font-size: 3rem;
            top: 10px;
            left: 20px;
            animation: sparkle 2s ease-in-out infinite;
        }

        .header::after {
            content: '🌟';
            position: absolute;
            font-size: 2.5rem;
            bottom: 10px;
            right: 20px;
            animation: sparkle 2s ease-in-out infinite 1s;
        }

        @keyframes sparkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.2) rotate(15deg); opacity: 0.7; }
        }

        .header h1 {
            font-family: 'Baloo 2', cursive;
            font-size: 2.8rem;
            font-weight: 800;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.15);
            letter-spacing: 1px;
        }

        .header p {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 5px;
            opacity: 0.95;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            padding: 15px 25px;
            background: white;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--dark);
            border-bottom: 3px dashed #ffd3b5;
        }

        .progress-bar {
            height: 12px;
            background: #ffe8d6;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--mint), var(--blue), var(--purple));
            background-size: 200% 100%;
            width: 0%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .question-area {
            padding: 45px 30px;
            text-align: center;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: white;
            position: relative;
        }

        .emoji-display {
            font-size: 6rem;
            margin-bottom: 20px;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.15));
            animation: bounce 2.5s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        .sentence {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.4;
            color: var(--dark);
            max-width: 100%;
            word-wrap: break-word;
        }

        .blank {
            display: inline-block;
            min-width: 180px;
            border-bottom: 5px dashed var(--pink);
            margin: 0 10px;
            color: transparent;
            font-weight: 700;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            vertical-align: baseline;
            padding: 0 5px;
        }

        .blank.filled {
            border-bottom-style: solid;
            border-bottom-color: var(--mint);
            color: var(--mint);
            transform: scale(1.15);
            text-shadow: 2px 2px 0 rgba(107, 207, 127, 0.2);
        }

        .feedback {
            text-align: center;
            padding: 10px;
            font-weight: 700;
            font-size: 1.3rem;
            height: 45px;
            opacity: 0;
            transition: opacity 0.3s;
            color: var(--pink);
            background: #fff0f5;
        }

        .feedback.show { opacity: 1; }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 25px;
            background: linear-gradient(135deg, #fff5e6 0%, #ffe8d6 100%);
        }

        .option-btn {
            border: none;
            padding: 22px 10px;
            border-radius: 20px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 8px 15px rgba(0,0,0,0.1);
            position: relative;
            top: 0;
        }

        .option-btn:hover {
            top: -4px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.15), 0 12px 20px rgba(0,0,0,0.15);
            transform: scale(1.03);
        }

        .option-btn:active {
            top: 4px;
            box-shadow: 0 2px 0 rgba(0,0,0,0.15), 0 4px 8px rgba(0,0,0,0.1);
        }

        .btn-always { background: linear-gradient(135deg, #ff6b9d 0%, #ee5a6f 100%); }
        .btn-usually { background: linear-gradient(135deg, #ffa751 0%, #ff8c42 100%); }
        .btn-often { background: linear-gradient(135deg, #ffd93d 0%, #ffc300 100%); color: var(--dark); }
        .btn-sometimes { background: linear-gradient(135deg, #6bcf7f 0%, #4caf50 100%); }
        .btn-rarely { background: linear-gradient(135deg, #4d96ff 0%, #2d7dd2 100%); }
        .btn-never { background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%); }

        /* Results Screen */
        .results-screen {
            display: none;
            padding: 40px 30px;
            text-align: center;
            background: white;
        }

        .results-screen.active {
            display: block;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results-title {
            font-family: 'Baloo 2', cursive;
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--pink), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .results-subtitle {
            font-size: 1.3rem;
            color: #666;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .stat-card {
            padding: 20px 15px;
            border-radius: 20px;
            color: white;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-word {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-count {
            font-family: 'Baloo 2', cursive;
            font-size: 3rem;
            font-weight: 800;
            line-height: 1;
        }

        .restart-btn {
            background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 100%);
            color: white;
            border: none;
            padding: 18px 50px;
            border-radius: 50px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(255, 107, 157, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
        }

        .restart-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 25px rgba(255, 107, 157, 0.5);
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .sentence {
                font-size: 1.6rem;
            }
            .header h1 {
                font-size: 2rem;
            }
            .blank {
                min-width: 130px;
            }
            .emoji-display {
                font-size: 4.5rem;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .stat-word {
                font-size: 1rem;
            }
            .stat-count {
                font-size: 2.2rem;
            }
            .results-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1>How Often Do You...?</h1>
        <p>Choose your answer! 🌈</p>
    </div>
    
    <div id="game-screen">
        <div class="score-board">
            <span id="level-indicator">Question 1 / 10</span>
            <span id="score-indicator">Choices: 0</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <div class="question-area">
            <div class="emoji-display" id="emoji">🌟</div>
            <div class="sentence" id="sentence">Loading...</div>
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="options-grid" id="options"></div>
    </div>

    <div class="results-screen" id="results-screen">
        <div class="results-title">🎉 Your Profile!</div>
        <div class="results-subtitle">Here's what you chose:</div>
        <div class="stats-grid" id="stats-grid"></div>
        <button class="restart-btn" onclick="location.reload()">Play Again ↺</button>
    </div>
</div>

<script>
    const adverbs = [
        { word: "Always", class: "btn-always" },
        { word: "Usually", class: "btn-usually" },
        { word: "Often", class: "btn-often" },
        { word: "Sometimes", class: "btn-sometimes" },
        { word: "Rarely", class: "btn-rarely" },
        { word: "Never", class: "btn-never" }
    ];

    const questions = [
        { text: "I ___ do my homework right after school.", emoji: "📚" },
        { text: "I ___ surf the net in the evening.", emoji: "💻" },
        { text: "I ___ eat pizza for breakfast.", emoji: "🍕" },
        { text: "I ___ watch TV with my family.", emoji: "📺" },
        { text: "I ___ listen to music while I do my homework.", emoji: "🎧" },
        { text: "I ___ play computer games after lessons.", emoji: "🎮" },
        { text: "I ___ get up late on Saturday.", emoji: "⏰" },
        { text: "I am ___ late for school.", emoji: "🏃" },
        { text: "I ___ help my parents with the housework.", emoji: "🧹" },
        { text: "I ___ go to bed late on school days.", emoji: "😴" }
    ];

    let currentQuestionIndex = 0;
    let choicesCount = 0;
    let stats = {
        "Always": 0, "Usually": 0, "Often": 0,
        "Sometimes": 0, "Rarely": 0, "Never": 0
    };

    const sentenceEl = document.getElementById('sentence');
    const emojiEl = document.getElementById('emoji');
    const optionsEl = document.getElementById('options');
    const feedbackEl = document.getElementById('feedback');
    const scoreEl = document.getElementById('score-indicator');
    const levelEl = document.getElementById('level-indicator');
    const progressEl = document.getElementById('progress');
    const gameScreen = document.getElementById('game-screen');
    const resultsScreen = document.getElementById('results-screen');
    const statsGrid = document.getElementById('stats-grid');

    function initGame() {
        shuffleArray(questions);
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestionIndex >= questions.length) {
            showResults();
            return;
        }

        const q = questions[currentQuestionIndex];
        
        emojiEl.textContent = q.emoji;
        sentenceEl.innerHTML = q.text.replace('___', '<span class="blank" id="blank">__________</span>');
        feedbackEl.className = 'feedback';
        feedbackEl.textContent = '';
        levelEl.textContent = `Question ${currentQuestionIndex + 1} / ${questions.length}`;
        
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        progressEl.style.width = `${progressPercent}%`;

        optionsEl.innerHTML = '';
        const shuffledAdverbs = [...adverbs].sort(() => Math.random() - 0.5);
        
        shuffledAdverbs.forEach(adv => {
            const btn = document.createElement('button');
            btn.className = `option-btn ${adv.class}`;
            btn.textContent = adv.word;
            btn.onclick = () => makeChoice(adv.word);
            optionsEl.appendChild(btn);
        });
    }

    function makeChoice(adverb) {
        choicesCount++;
        stats[adverb]++;
        
        scoreEl.textContent = `Choices: ${choicesCount}`;
        
        const blank = document.getElementById('blank');
        blank.textContent = adverb;
        blank.classList.add('filled');
        
        feedbackEl.textContent = `"${adverb}" — nice choice! ✨`;
        feedbackEl.classList.add('show');

        const buttons = optionsEl.querySelectorAll('.option-btn');
        buttons.forEach(btn => {
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.6';
        });

        setTimeout(() => {
            currentQuestionIndex++;
            loadQuestion();
        }, 1100);
    }

    function showResults() {
        gameScreen.style.display = 'none';
        resultsScreen.classList.add('active');
        progressEl.style.width = "100%";

        statsGrid.innerHTML = '';
        
        const colors = {
            "Always": "linear-gradient(135deg, #ff6b9d, #ee5a6f)",
            "Usually": "linear-gradient(135deg, #ffa751, #ff8c42)",
            "Often": "linear-gradient(135deg, #ffd93d, #ffc300)",
            "Sometimes": "linear-gradient(135deg, #6bcf7f, #4caf50)",
            "Rarely": "linear-gradient(135deg, #4d96ff, #2d7dd2)",
            "Never": "linear-gradient(135deg, #9b59b6, #8e44ad)"
        };

        Object.keys(stats).forEach(word => {
            const card = document.createElement('div');
            card.className = 'stat-card';
            card.style.background = colors[word];
            
            card.innerHTML = `
                <div class="stat-word">${word}</div>
                <div class="stat-count">${stats[word]}</div>
            `;
            statsGrid.appendChild(card);
        });
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    initGame();
</script>

</body>
</html>
