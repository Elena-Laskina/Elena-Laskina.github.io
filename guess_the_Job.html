<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs Flashcards 🎯</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            max-width: 1400px;
            width: 100%;
            margin-bottom: 40px;
        }

        .card {
            perspective: 1000px;
            height: 340px;
            cursor: pointer;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }
        .card:nth-child(6) { animation-delay: 0.6s; }
        .card:nth-child(7) { animation-delay: 0.7s; }
        .card:nth-child(8) { animation-delay: 0.8s; }
        .card:nth-child(9) { animation-delay: 0.9s; }
        .card:nth-child(10) { animation-delay: 1.0s; }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-radius: 20px;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
        }

        .card-front {
            background: linear-gradient(135deg, #e0c3fc 0%, #d4b8f5 100%);
            color: #6b4f9e;
        }

        .card-back {
            background: linear-gradient(135deg, #89cff0 0%, #6bb6e0 100%);
            color: #1a4d6e;
            transform: rotateY(180deg);
        }

        .card-number {
            font-size: 9rem;
            font-weight: 800;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
            margin-bottom: 10px;
            line-height: 1;
        }

        .card-icon {
            font-size: 3.8rem;
            margin-bottom: 10px;
        }

        .card-text {
            font-size: clamp(1.4rem, 2.2vw, 2rem);
            font-weight: 600;
            line-height: 1.35;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.3);
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            animation: fadeIn 1s ease-out 1.5s backwards;
        }

        .btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            background: #f0f0f0;
        }

        .btn:active {
            transform: translateY(-1px);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: repeat(3, 1fr);
            }
            .card-number {
                font-size: 8rem;
            }
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            
            .header h1 {
                font-size: 2.5rem;
            }
            
            .card {
                height: 300px;
            }
            
            .card-number {
                font-size: 7rem;
            }
            
            .card-icon {
                font-size: 3rem;
            }

            .card-text {
                font-size: clamp(1.3rem, 3vw, 1.8rem);
            }
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .header p {
                font-size: 1rem;
            }
            
            .card {
                height: 280px;
            }
            
            .card-number {
                font-size: 6rem;
            }
            
            .card-icon {
                font-size: 2.5rem;
            }

            .card-text {
                font-size: clamp(1.2rem, 4.5vw, 1.6rem);
                line-height: 1.4;
            }
            
            .controls {
                flex-direction: column;
                width: 100%;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 Guess the Job! ✨</h1>
        <p>Click on the cards to reveal the situations</p>
    </div>

    <div class="container" id="cardsContainer"></div>

    <div class="controls">
        <button class="btn" onclick="flipAll()">
            <i class="fas fa-sync-alt"></i> Flip All Cards
        </button>
        <button class="btn" onclick="resetAll()">
            <i class="fas fa-redo"></i> Reset
        </button>
    </div>

    <script>
        const cardsData = [
            { number: 1, text: "Why haven't you done your homework?", icon: "📚" },
            { number: 2, text: "Open your mouth and say «AAH!»", icon: "🏥" },
            { number: 3, text: "There is a letter for you. Sign here, please.", icon: "📬" },
            { number: 4, text: "Your puppy is healthy and playful! Don't forget his next vaccination next month", icon: "🐕" },
            { number: 5, text: "These tulips are fresh from the garden this morning. Would you like them wrapped?", icon: "🌷" },
            { number: 6, text: "We will be landing in 20 minutes. Please return to your seats and fasten seatbelts", icon: "✈️" },
            // Card 7 removed
            { number: 7, text: "Taste this soup, please. Does it need more salt or pepper?", icon: "🍲" },
            { number: 8, text: "Would you like some water with your meal? Here is the menu.", icon: "🍽️" },
            { number: 9, text: "Just a little trim? Or would you like to try a new hairstyle today?", icon: "💇" },
            // Card 11 removed
            { number: 10, text: "Don't worry, the fire is out now.", icon: "🚒" }
        ];

        const container = document.getElementById('cardsContainer');

        cardsData.forEach(card => {
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            // Removed emoji from front side, kept only number
            cardElement.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">
                        <div class="card-number">${card.number}</div>
                    </div>
                    <div class="card-back">
                        <div class="card-icon">${card.icon}</div>
                        <div class="card-text">${card.text}</div>
                    </div>
                </div>
            `;
            
            cardElement.addEventListener('click', function() {
                this.classList.toggle('flipped');
            });
            
            container.appendChild(cardElement);
        });

        function flipAll() {
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                if (!card.classList.contains('flipped')) {
                    card.classList.add('flipped');
                }
            });
        }

        function resetAll() {
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                card.classList.remove('flipped');
            });
        }
    </script>
</body>
</html>
